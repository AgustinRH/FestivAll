# FestivAll — Producción (docker compose up -d --build)
# Variables: .env (raíz) y/o backend/.env → el backend carga ambos (env_file).
# Stripe: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, FRONTEND_URL en .env raíz o backend/.env
# Si está en ambos, prevalece backend/.env. Ver .env.example en la raíz.
services:
  mariadb:
    image: mariadb:11
    container_name: festivall-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_DATABASE:-FestivAll}
    volumes:
      - festivall_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - festivall-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: festivall-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-FestivAll}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-https://festivall.club/api}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_SECRET_KEY_TEST: ${STRIPE_SECRET_KEY_TEST:-}
      STRIPE_SECRET_KEY_LIVE: ${STRIPE_SECRET_KEY_LIVE:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET_TEST: ${STRIPE_WEBHOOK_SECRET_TEST:-}
      STRIPE_WEBHOOK_SECRET_LIVE: ${STRIPE_WEBHOOK_SECRET_LIVE:-}
      STRIPE_TAX_RATE_ID: ${STRIPE_TAX_RATE_ID:-}
      STRIPE_TAX_RATE_ID_TEST: ${STRIPE_TAX_RATE_ID_TEST:-}
      STRIPE_TAX_RATE_ID_LIVE: ${STRIPE_TAX_RATE_ID_LIVE:-}
      FESTIVALL_COMMISSION_PERCENT: ${FESTIVALL_COMMISSION_PERCENT:-10}
      STRIPE_FEE_PERCENT: ${STRIPE_FEE_PERCENT:-1.5}
      STRIPE_FEE_FIXED_EUR: ${STRIPE_FEE_FIXED_EUR:-0.25}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      UPLOAD_ROOT: /app/uploads
    volumes:
      - festivall_uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - festivall-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: festivall-web
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - festivall-net

volumes:
  festivall_data:
  festivall_uploads:

networks:
  festivall-net:
    driver: bridge
