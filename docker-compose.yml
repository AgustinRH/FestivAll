# FestivAll — Producción (docker compose up -d --build)
# Variables: .env (raíz) y/o backend/.env → el backend carga ambos (env_file).
# Stripe: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, FRONTEND_URL en .env raíz o backend/.env
# Si está en ambos, prevalece backend/.env. Ver .env.example en la raíz.
services:
  mariadb:
    image: mariadb:11
    container_name: festivall-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-FestivAll}
    volumes:
      - festivall_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - festivall-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: festivall-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_DATABASE: ${DB_DATABASE:-FestivAll}
      JWT_SECRET: ${JWT_SECRET:-REDACTED}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TAX_RATE_ID: ${STRIPE_TAX_RATE_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - festivall-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: festivall-web
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - festivall-net

volumes:
  festivall_data:

networks:
  festivall-net:
    driver: bridge
