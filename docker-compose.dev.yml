# Solo MariaDB para desarrollo local (npm run start:dev + npm start)
# Requires .env with DB_PASSWORD (see .env.example).
services:
  mariadb:
    image: mariadb:11
    container_name: festivall-db-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_DATABASE:-FestivAll}
    ports:
      - '3306:3306'
    volumes:
      - festivall_data_dev:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  festivall_data_dev:
