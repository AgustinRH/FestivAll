<header class="site-header">
  <a routerLink="/" class="logo">
    <img src="logo-festivall.png" alt="FestivAll Almería" />
  </a>

  <nav class="main-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <span class="sep">|</span>
    <a routerLink="/eventos" routerLinkActive="active">Explorar Festivales</a>
    @if (auth.isLoggedIn()) {
      <span class="sep">|</span>
      <a routerLink="/perfil" routerLinkActive="active">Perfil</a>
    }
    <span class="sep">|</span>
    <a routerLink="/" fragment="sobre">Sobre Nosotros</a>
  </nav>

  <div class="auth-links">
    @if (auth.isLoggedIn()) {
      <button type="button" class="link-btn" (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/login">Login</a>
      <span class="sep">|</span>
      <a routerLink="/register">Register</a>
    }
  </div>
</header>
