<article class="fest-card">
  <a [routerLink]="['/eventos', evento.id]" class="card-image">
    <img [src]="imagenUrl" [alt]="evento.titulo" />
  </a>
  <div class="card-body">
    <h3>{{ evento.titulo }}</h3>
    <p class="meta">📍 {{ evento.ubicacion?.localidad }}, {{ evento.ubicacion?.provincia }}</p>
    <p class="meta">{{ evento.categoria?.nombreCategoria }}</p>
    <p class="precio">{{ evento.precio | currency:'EUR':'symbol':'1.0-0' }}</p>
    <a [routerLink]="['/eventos', evento.id]" class="btn-outline card-btn">VER DETALLES</a>
  </div>
</article>
