<div class="auth-page">
  <div class="auth-card">
    <h1>Register</h1>
    @if (error) { <p class="error">{{ error }}</p> }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <input formControlName="nombre" placeholder="Nombre" />
      <input formControlName="apellidos" placeholder="Apellidos" />
      <input type="email" formControlName="email" placeholder="Email" />
      <input type="password" formControlName="password" placeholder="Password" />
      <input type="password" formControlName="confirmPassword" placeholder="Confirmar Password" />
      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Registrando...' : 'Crear cuenta' }}
      </button>
    </form>
    <p class="link">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
  </div>
</div>
