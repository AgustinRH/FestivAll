<DIV class="auth-page">
  <DIV class="auth-card">
    <h1>Festiv<span>All</span></h1>
    <p class="subtitle">Inicia sesión para descubrir eventos en Almería</p>
    @if (error) { <p class="error">{{ error }}</p> }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="tu@email.com" />
      <label>Contraseña</label>
      <input type="password" formControlName="password" placeholder="••••••" />
      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Entrando...' : 'Iniciar sesión' }}
      </button>
    </form>
    <p class="link">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </DIV>
</DIV>
