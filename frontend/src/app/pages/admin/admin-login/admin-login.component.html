<div class="admin-login">
  <div class="login-panel">
    <div class="brand">
      <img src="logo-festivall.png" alt="FestivAll" />
      <div>
        <h1>Panel de administración</h1>
        <p>Gestiona eventos y festivales de Almería</p>
      </div>
    </div>

    @if (sessionInfo) {
      <div class="alert-info" role="status">{{ sessionInfo }}</div>
    }
    @if (error) {
      <div class="alert-error" role="alert">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label [class.has-error]="isInvalid('email')">
        <span>Correo electrónico</span>
        <input type="email" formControlName="email" placeholder="correo@ejemplo.com" autocomplete="username" />
        <app-form-field-error [control]="form.get('email')" label="correo electrónico" />
      </label>
      <label [class.has-error]="isInvalid('password')">
        <span>Contraseña</span>
        <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
        <app-form-field-error [control]="form.get('password')" label="contraseña" />
      </label>
      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'Verificando acceso…' : 'Entrar al panel' }}
      </button>
    </form>

    <a routerLink="/" class="back-home">← Volver al sitio público</a>
  </div>
</div>
