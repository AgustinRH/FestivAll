<div class="admin-login">
  <div class="login-panel">
    <div class="brand">
      <img src="logo-festivall.png" alt="FestivAll" />
      <div>
        <h1>Panel de administración</h1>
        <p>Gestiona eventos y festivales de Almería</p>
      </div>
    </div>

    @if (error) {
      <div class="alert-error" role="alert">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Correo electrónico</span>
        <input type="email" formControlName="email" placeholder="admin@festivall.es" autocomplete="username" />
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
      </label>
      <button type="submit" class="btn-submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Verificando acceso…' : 'Entrar al panel' }}
      </button>
    </form>

    <a routerLink="/" class="back-home">← Volver al sitio público</a>
  </div>
</div>
