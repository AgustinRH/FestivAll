# HTTP — validación Let's Encrypt y redirección a HTTPS
server {
    listen 80;
    server_name festivall.club;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP www → HTTPS sin www
server {
    listen 80;
    server_name www.festivall.club;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://festivall.club$request_uri;
    }
}

# HTTP por IP (sin certificado para la IP)
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Sitemap dinámico (API): prioridad sobre try_files / index.html
    location = /sitemap.xml {
        proxy_pass http://backend:3000/sitemap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location = /sitemap {
        return 301 /sitemap.xml;
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS — dominio principal
server {
    listen 443 ssl;
    http2 on;
    server_name www.festivall.club;

    ssl_certificate /etc/letsencrypt/live/festivall.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/festivall.club/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://festivall.club$request_uri;
}

