name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - run: npm test -- --passWithNoTests
      - run: npm run build

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build every Dockerfile
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name 'Dockerfile' -o -name 'Dockerfile.*' | grep -v node_modules || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Dockerfiles found"
            exit 1
          fi
          for f in "${files[@]}"; do
            dir=$(dirname "$f")
            tag="ci-$(basename "$dir" | tr '[:upper:]' '[:lower:]')"
            echo "::group::docker build -f $f ($tag)"
            docker build -f "$f" -t "$tag" "$dir"
            echo "::endgroup::"
          done
